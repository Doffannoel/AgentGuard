[project]
name = "agentguard-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1", "argon2-cffi>=23.1", "jsonschema>=4.23,<5", "pyyaml>=6,<7",
  "opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "prometheus-client>=0.21,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "pyright>=1.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
